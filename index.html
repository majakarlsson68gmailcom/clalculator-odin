<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">

        <div class="input-display">
            <input type="text" readonly>
        </div>

        <div class="button-container">

            
            <div class="spacer"></div>
            <button class="operator-btn delete" value="delete">⌫</button>
            
            <button class="num-btn" value="number">7</button>
            <button class="num-btn" value="number">8</button>
            <button class="num-btn" value="number">9</button>
            <button class="operator-btn" value="divide">÷</button>
            

            <button class="num-btn" value="number">4</button>
            <button class="num-btn" value="number">5</button>
            <button class="num-btn" value="number">6</button>
            <button class="operator-btn" value="multi">×</button>

            <button class="num-btn" value="number">1</button>
            <button class="num-btn" value="number">2</button>
            <button class="num-btn" value="number">3</button>
            <button class="operator-btn" value="add">+</button>

            <button class="num-btn btn-zero" value="number">0</button>
            <button class="operator-btn" value="subtract">−</button>
            <button class="operator-btn" value="number">.</button>
           
            
            
            <button class="operator-btn clear" value="clear">C</button>
            <button class="operator-btn" value="equal">=</button>

        </div>

    </div>
</body>
</html>
