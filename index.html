<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">

        <div class="input-display">
            <span></span>
        </div>

        <div class="button-container">

            
            <div class="spacer"></div>
            <button class="operator-btn delete">⌫</button>
            
            <button class="num-btn" value="7">7</button>
            <button class="num-btn" value="8">8</button>
            <button class="num-btn" value="9">9</button>
            <button class="operator-btn" id="divide">÷</button>
            

            <button class="num-btn" value="4">4</button>
            <button class="num-btn" value="5">5</button>
            <button class="num-btn" value="6">6</button>
            <button class="operator-btn" id="multi">×</button>

            <button class="num-btn">1</button>
            <button class="num-btn">2</button>
            <button class="num-btn">3</button>
            <button class="operator-btn" id="add">+</button>

            <button class="num-btn btn-zero" value="0">0</button>
            <button class="operator-btn" id="subtract">−</button>
            <button class="operator-btn" id="dot">.</button>
           
            
            
            <button class="operator-btn clear">C</button>
            <button class="operator-btn" id="equal">=</button>

        </div>

    </div>
</body>
</html>
